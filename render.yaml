services:
  - type: web
    runtime: docker
    name: smart-hydro-alert

    dockerfilePath: ./Dockerfile
    dockerContext: .

    plan: free
    region: singapore

    healthCheckPath: /health

    envVars:
      - key: APP_ENV
        value: production

      - key: MONGO_DB
        value: smart_water

      - key: MONGO_URI
        sync: false

      - key: ADMIN_API_KEY
        sync: false